services:
  app:
    build: .
    container_name: voltbrew-backend
    
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/voltbrew

      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_ACCOUNT_SECRET=${TWILIO_ACCOUNT_SECRET}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}

    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: voltbrew-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data: